# cargo-deny configuration: supply-chain vulnerability/license/source
# scanning for the whole workspace (Cargo.lock's ~380 packages, including
# wasmtime, the most security-sensitive dependency). Run locally with
# `cargo deny check`; wired into CI in .github/workflows/ci.yml.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive, not in our direct dependency tree; tracked in
    # todo.md's "Dependency hygiene" section.
    "RUSTSEC-2024-0436", # paste — unmaintained, no vulnerability
    # Direct/transitive deps of tpt-chora-text's rustybuzz-based shaping;
    # unmaintained (not a vulnerability). Replacement candidates (swash/
    # skrifa) tracked in todo.md rather than pinned here.
    "RUSTSEC-2026-0206", # rustybuzz — unmaintained
    "RUSTSEC-2026-0192", # ttf-parser — unmaintained
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates reference each other via path deps with no
# version requirement (e.g. tpt-chora-all-subsystems's Cargo.toml) — these
# are pinned by the workspace itself, not a real "any version" supply-chain
# risk, so don't count them against `wildcards = "deny"`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
