name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Install software Vulkan driver (lavapipe)
        # GPU-executing tests/examples need a Vulkan adapter; the runner has
        # no hardware GPU, so install Mesa's software (llvmpipe/lavapipe)
        # ICD and let wgpu's existing force_fallback_adapter path pick it up.
        # Only runs on Linux runners.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libgl1-mesa-dri
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test (spatial feature)
        # The spatial feature exercises stereoscopic/foveated/volumetric
        # render-graph nodes; these require a Vulkan adapter so only run
        # on Linux where lavapipe is available.
        if: runner.os == 'Linux'
        run: cargo test -p tpt-chora-render --features spatial
      - name: Test (native-a11y-backends feature)
        # Windows UIA backend is buildable on ubuntu-latest via the
        # windows crate; macOS/Android backends require their respective
        # platforms so they are only verified on those runners.
        if: runner.os == 'Windows'
        run: cargo test -p tpt-chora-a11y --features native-a11y-backends
      - name: Test (native-haptics-backends feature)
        # CoreHaptics requires macOS; Android Vibrator requires Android.
        # On Linux runners this feature adds no testable code.
        if: runner.os == 'macOS'
        run: cargo test -p tpt-chora-input --features native-haptics-backends
      - name: Test (native-video-backends feature)
        # VA-API requires Linux with libva-dev; VideoToolbox requires macOS;
        # MediaCodec requires Android. Only Linux is CI-verified here.
        if: runner.os == 'Linux'
        run: cargo test -p tpt-chora-media --features native-video-backends

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny (advisories, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libgl1-mesa-dri
      - name: Run benchmarks (smoke mode)
        # Shared, noisy GitHub-hosted runners can't give stable enough
        # timings for a statistical threshold gate (a criterion baseline
        # comparison would false-positive on runner-to-runner variance).
        # `--test` runs every benchmark for a single iteration instead of
        # a full statistical sample, so this is a correctness/regression
        # signal ("does every benchmark still build and execute against
        # the current render graph/runtime APIs") rather than a
        # performance-threshold gate. Tracking real perf history needs a
        # dedicated, consistently-provisioned runner — not yet available.
        run: cargo bench --workspace -- --test
      - name: Zero-allocation steady-state check
        run: cargo test -p tpt-chora-bench --features dhat-heap --test zero_alloc
