name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Install software Vulkan driver (lavapipe)
        # GPU-executing tests/examples need a Vulkan adapter; the runner has
        # no hardware GPU, so install Mesa's software (llvmpipe/lavapipe)
        # ICD and let wgpu's existing force_fallback_adapter path pick it up.
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libgl1-mesa-dri
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test (spatial feature)
        run: cargo test -p tpt-chora-render --features spatial

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny (advisories, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
