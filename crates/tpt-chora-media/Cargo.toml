[package]
name = "tpt-chora-media"
description = "tpt-chora Media & Asset Pipeline (The Content): async image/video decoding, asset streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["media", "image", "video", "decoding", "asset-streaming"]
categories = ["multimedia", "multimedia::images", "multimedia::video"]

[dependencies]
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[features]
default = []
native-video-backends = ["libva-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
libva-sys = { version = "0.1", optional = true, features = ["drm"] }

[dev-dependencies]
png = "0.17"
