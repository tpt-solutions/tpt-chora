[package]
name = "tpt-chora-input"
description = "tpt-chora Input & Interaction Engine (The Senses): unified device abstraction, hit testing, haptics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["input", "hit-testing", "gesture", "haptics", "gaze"]
categories = ["gui", "hardware-support"]

[dependencies]
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = "1.0"
glam = "0.25"
bitflags = "2"

[features]
default = []
native-haptics-backends = ["objc2", "jni"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["alloc", "std"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[dev-dependencies]
pollster = "0.3"
