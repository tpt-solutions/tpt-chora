[package]
name = "tpt-chora-spatial"
description = "tpt-chora Spatial & 3D Engine (The Depth): stereoscopic rendering, foveated rendering, volumetric lighting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["3d", "stereoscopic", "vr", "spatial-audio", "foveated-rendering"]
categories = ["graphics", "multimedia::audio"]

[dependencies]
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
thiserror = "1.0"
glam = "0.25"
rodio = { version = "0.18", default-features = false, features = ["wav"] }

[dev-dependencies]
png = "0.17"
