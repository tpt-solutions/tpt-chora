[package]
name = "tpt-chora-text"
description = "tpt-chora Typography & Text Engine (The Voice): SDF font atlas, text shaping, sub-pixel rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["text", "typography", "sdf", "font", "shaping"]
categories = ["text-processing", "rendering"]

[dependencies]
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
thiserror = "1.0"
ab_glyph = "0.2"
rustybuzz = "0.11"
unicode-bidi = "0.3"
unicode-script = "0.5"

[dev-dependencies]
png = "0.17"
